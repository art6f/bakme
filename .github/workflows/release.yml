name: Release

on:
  push:
    tags: ["release/**"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos-arm:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build release
        run: cargo build --release --target aarch64-apple-darwin

      - name: Copy binary checksum
        run: cp target/aarch64-apple-darwin/release/bakme bakme

      - name: Generate checksum
        run: |
          shasum -a 256 -b bakme > bakme.checksum
          cat bakme.checksum

      - name: Pack archive
        run: zip bakme-aarch64-apple-darwin.zip bakme bakme.checksum

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: bakme-aarch64-apple-darwin.zip
          body: "To be provided..."

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get install -y musl-tools

      - name: Build release
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Copy binary and generate checksum
        run: |
          cp target/x86_64-unknown-linux-musl/release/bakme bakme
          shasum -a 256 -b bakme > bakme.checksum
          cat bakme.checksum

      - name: Pack zip archive
        run: zip bakme-linux-x86_64-musl.zip bakme bakme.checksum

      - name: Create .deb package
        run: |
          mkdir -p deb-root/usr/local/bin deb-root/usr/local/share/doc/bakme
          cp bakme deb-root/usr/local/bin/bakme
          cp bakme.checksum deb-root/usr/local/share/doc/bakme/checksum
          echo "2.0" > debian-binary
          printf "Package: bakme\nVersion: %s\nArchitecture: amd64\nMaintainer: azure\nDescription: A small, lightweight cli bak-ing tool\n" "${{ github.ref_name }}" > control
          tar cf control.tar.gz control debian-binary
          gzip control.tar.gz
          tar cf data.tar.gz -C deb-root .
          dpkg-deb --build . bakme_${{ github.ref_name }}_amd64.deb

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            bakme-linux-x86_64-musl.zip
            bakme_${{ github.ref_name }}_amd64.deb
          body: "To be provided..."
